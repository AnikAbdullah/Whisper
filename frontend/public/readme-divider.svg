<title id="title">Divider</title>
<desc id="desc">Thin divider line: two sparks travel toward a small chat-bubble icon in the middle.</desc>
<style>.s{font-family:'W-Sans',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:'W-Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}text{dominant-baseline:auto}.sp{opacity:0}.spl{animation:spl 3.6s cubic-bezier(.5,0,.8,.6) infinite}.spr{animation:spr 3.6s cubic-bezier(.5,0,.8,.6) infinite}@keyframes spl{0%{opacity:0;transform:translateX(0)}10%{opacity:1}45%{opacity:1;transform:translateX(480px)}50%,100%{opacity:0;transform:translateX(480px)}}@keyframes spr{0%{opacity:0;transform:translateX(0)}10%{opacity:1}45%{opacity:1;transform:translateX(-480px)}50%,100%{opacity:0;transform:translateX(-480px)}}.ic{transform-box:fill-box;transform-origin:center;animation:ic 3.6s ease-out infinite}@keyframes ic{0%,44%{transform:scale(1)}52%{transform:scale(1.22)}64%,100%{transform:scale(1)}}.dd{animation:dd 1.2s ease-in-out infinite}@keyframes dd{0%,60%,100%{opacity:.35}30%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}.rm-show{display:inline!important}}</style>
